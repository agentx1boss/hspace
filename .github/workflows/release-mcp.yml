# 打 mcp-v* tag 自动发布 hspace-mcp 到 npm。
# 需要仓库 secret:NPM_TOKEN(npmjs.com 建 Automation 或 Granular token,勾选 bypass 2FA)
#
# 用法:改 mcp-server/package.json version → git tag mcp-v<x.y.z> → push tag
# (与插件的 v* tag 互不干扰:v* 发双市场,mcp-v* 发 npm)

name: Release MCP

on:
  push:
    tags: ["mcp-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#mcp-v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag mcp-v$TAG 与 package.json 版本 $PKG 不一致"
            exit 1
          fi

      - run: npm ci
      - run: npm test        # CLI 的参数/装配/不变量测试(密码不进 argv 等)
      - run: npm run build

      # 用**打包后的 tarball** 跑真实公开命令:能抓住 bin 映射/files 白名单/
      # npx 解析这类只在装包后才暴露的问题(npm 上的 `hspace` 是别人的包,
      # 所以零安装形式必须带 --package)
      - name: 冒烟:打包后按公开命令跑
        run: |
          TARBALL="$(npm pack --silent)"
          npx --yes --package="./$TARBALL" hspace --version
          npx --yes --package="./$TARBALL" hspace help > /dev/null
          rm -f "$TARBALL"

      - name: 发布到 npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
